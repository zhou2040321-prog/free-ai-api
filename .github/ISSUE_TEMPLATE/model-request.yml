name: 模型需求投票
description: 提议并讨论希望平台评估的模型
title: "[模型需求] "
body:
  - type: markdown
    attributes:
      value: "请只提交模型名称和一般性需求，不要包含 API Key、账号信息、私人对话或其他个人数据。提交需求不代表模型已受支持或一定会加入。"
  - type: input
    id: model_name
    attributes:
      label: 希望增加的模型名称
      description: 如有官方公布的准确模型 ID，请注明来源；不确定时请写明尚未确认。
      placeholder: 模型名称或 ID（如已知）
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 主要用途
      description: 例如编码、写作、图像理解或学习研究。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 为什么希望增加
      description: 说明当前遇到的需求或缺口。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 是否有替代模型
      description: 可填写其他已知选项；不清楚可留空。
